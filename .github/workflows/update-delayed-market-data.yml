name: Update 31+ day delayed market data

on:
  schedule:
    - cron: "30 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: delayed-market-data
  cancel-in-progress: false

jobs:
  update:
    if: ${{ vars.FINSIM_MARKET_DATA_AUTHORIZED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out FinSim India
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build delayed official exchange quotes
        env:
          FINSIM_MARKET_DATA_AUTHORIZED: ${{ vars.FINSIM_MARKET_DATA_AUTHORIZED }}
        run: python scripts/build_delayed_market_data.py
      - name: Publish updated public quote snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-quotes.json
          if git diff --cached --quiet; then
            echo "No new delayed market data to publish."
          else
            git commit -m "Update 31+ day delayed market quotes"
            git push
          fi
